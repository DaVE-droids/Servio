<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the value of `--base-href` at build time.
    It must start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Servio · Field placement management</title>
  <meta name="description" content="Servio runs the whole field placement cycle in one place: students log attendance and daily entries, lecturers supervise, and coordinators see every placement from submission to sign-off.">
  <meta name="theme-color" content="#F3F5F9">
  <meta name="color-scheme" content="light">

  <!-- Link previews (WhatsApp, Slack, email). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Servio">
  <meta property="og:description" content="Field placements, from first form to final sign-off.">
  <meta property="og:url" content="https://servio-e2974.web.app/">
  <meta property="og:image" content="https://servio-e2974.web.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Installable web app and home-screen icons. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Servio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /* The loading screen: the same mark as the app's splash, shown by the
       browser instantly while Flutter downloads, then faded out on
       Flutter's first frame (see flutter_bootstrap.js). */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #app-loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; background: #FFFFFF;
      transition: opacity 300ms ease;
    }
    #app-loader.is-done { opacity: 0; pointer-events: none; }
    #app-loader svg { width: 96px; height: 96px; }
    #app-loader .bar {
      width: 96px; height: 3px; border-radius: 2px; overflow: hidden;
      background: #E6ECF4;
    }
    #app-loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #16365C;
      animation: servio-slide 1.1s ease-in-out infinite;
    }
    @keyframes servio-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .bar::after { animation: none; width: 100%; }
    }
    noscript div {
      font-family: system-ui, sans-serif; color: #0F2742;
      max-width: 420px; margin: 20vh auto 0; padding: 0 24px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="app-loader" role="progressbar" aria-label="Loading Servio">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="28" fill="#16365C"/>
      <path d="M30 70 C30 44 70 56 70 33" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round"/>
      <circle cx="30" cy="72" r="8.5" fill="#BFE5EE"/>
      <circle cx="70" cy="28" r="8.5" fill="none" stroke="#F6D0EA" stroke-width="7.6"/>
    </svg>
    <div class="bar"></div>
  </div>
  <noscript>
    <div>
      <h1>Servio needs JavaScript</h1>
      <p>Turn on JavaScript in your browser settings, then reload this page.</p>
    </div>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
